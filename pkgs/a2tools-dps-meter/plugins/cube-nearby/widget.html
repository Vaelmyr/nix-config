<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cube Compass</title><link rel="stylesheet" href="widget.css"></head>
<body>
  <main id="compass" class="compass" aria-label="Hidden Cube compass overlay">
    <div class="heading">CUBE COMPASS <span id="move-hint" hidden>DRAG TO MOVE</span></div>
    <div class="dial"><span class="north">N</span><span class="east">E</span><span class="south">S</span><span class="west">W</span><span id="arrow" class="arrow" hidden>↑</span><span id="no-fix" class="no-fix">Waiting</span></div>
    <div id="distance" class="distance">No cube nearby</div>
    <div id="detail" class="detail">Map north · waiting for data</div>
    <div id="session" class="session">0 opened this session</div>
  </main>
  <script src="/_sdk/a2.js"></script><script src="widget.js"></script>
</body></html>
